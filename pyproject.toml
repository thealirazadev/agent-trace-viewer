[project]
name = "agent-trace-viewer"
version = "0.2.0"
description = "Render agent traces (model calls, tool calls, tokens, latency, cost) from JSONL as a terminal summary or a self-contained HTML report."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ali Raza" }]
dependencies = [
]

[project.scripts]
atv = "agent_trace_viewer.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov==7.1.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_trace_viewer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "--cov=agent_trace_viewer --cov-report=term-missing:skip-covered"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.report]
fail_under = 95
